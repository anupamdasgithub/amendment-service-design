apiVersion: apps/v1
kind: Deployment
metadata:
  name: amendments-service
  labels:
    app: amendments-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: amendments-service
  template:
    metadata:
      labels:
        app: amendments-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: amendments-service
          image: amendments-service:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: amendments-config
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: amendments-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amendments-secrets
                  key: db-password
            - name: OIDC_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: amendments-config
                  key: oidc-issuer
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: amendments-config
                  key: kafka-brokers
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: amendments-service
spec:
  selector:
    app: amendments-service
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: amendments-service
spec:
  podSelector:
    matchLabels:
      app: amendments-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: kafka
      ports:
        - port: 9092

name: CI

# BAMOE artifacts are not published to Maven Central — IBM distributes them
# through a locally hosted BAMOE Maven repository (see README "Building").
# A public runner has no route to it, so this workflow validates the BPMN and
# DMN models, which needs no IBM artifacts, and leaves the Java build and the
# DMN unit tests to run locally where the repository is configured.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-models:
    name: Validate BPMN and DMN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: BPMN flow reference integrity
        run: python3 scripts/validate_bpmn_refs.py src/main/resources/processes

      - name: DMN decision table arity
        run: python3 scripts/validate_dmn_arity.py src/main/resources/decisions

      - name: XML well-formedness
        run: |
          fail=0
          for f in $(find src/main/resources -name '*.bpmn' -o -name '*.dmn') pom.xml; do
            if python3 -c "import xml.etree.ElementTree as ET; ET.parse('$f')" 2>/dev/null; then
              echo "PASS: $f"
            else
              echo "FAIL: $f"
              fail=1
            fi
          done
          exit $fail

  validate-sql:
    name: Validate migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: amendments_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: [ '5432:5432' ]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Applies the migrations for real against Postgres. Catches a syntax
      # error or a broken constraint that a linter would miss.
      - name: Apply migrations
        env:
          PGPASSWORD: ci
        run: |
          for f in $(ls src/main/resources/db/migration/V*.sql | sort); do
            echo ">>> $f"
            psql -h localhost -U ci -d amendments_ci -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Verify expected tables exist
        env:
          PGPASSWORD: ci
        run: |
          for t in process_instances correlation_instances job_details \
                   amendment_request amendment_item amendment_party_consent \
                   amendment_document amendment_audit; do
            psql -h localhost -U ci -d amendments_ci -v ON_ERROR_STOP=1 \
              -c "SELECT 1 FROM information_schema.tables WHERE table_name = '$t';" \
              | grep -q '1 row' && echo "PASS: $t" || { echo "FAIL: $t missing"; exit 1; }
          done
